window.pdfjsReady=new Promise(resolve=>{
  const script=document.createElement("script");let settled=false;
  const finish=lib=>{if(settled)return;settled=true;resolve(lib||null);};
  script.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  script.async=true;
  script.onload=()=>{if(window.pdfjsLib)window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";finish(window.pdfjsLib);};

});

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;}
body{background:#080808;color:#F0EDE6;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#0a0a0a;}
::-webkit-scrollbar-thumb{background:#222;border-radius:2px;}
.app{min-height:100vh;background:#080808;padding-bottom:env(safe-area-inset-bottom);}
.header{border-bottom:1px solid #1C1C1C;padding:0 32px;display:flex;align-items:stretch;justify-content:space-between;gap:12px;}
.header-left{display:flex;align-items:center;gap:14px;padding:16px 0;min-width:0;}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-style:italic;color:#C8952C;letter-spacing:.02em;white-space:nowrap;}
.header-sep{width:1px;height:20px;background:#1C1C1C;}
.header-sub{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.2em;color:#4A4A4A;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-right{display:flex;align-items:center;gap:8px;}
.hbtn{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#333;background:none;border:1px solid #1C1C1C;padding:5px 10px;border-radius:2px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.hbtn:hover{color:#C8952C;border-color:#C8952C;}
.hbtn.ok{color:#6DB87A;border-color:#1B4D2E;}
.hbtn.warn{color:#C8952C;border-color:#4a3a12;}
.steps{display:flex;padding:0 32px;border-bottom:1px solid #1C1C1C;overflow-x:auto;}
.step-item{display:flex;align-items:center;gap:8px;padding:13px 16px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#222;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.step-item.active{color:#F0EDE6;border-bottom-color:#C8952C;}
.step-item.done{color:#4A4A4A;border-bottom-color:#1C1C1C;cursor:pointer;}
.step-num{width:18px;height:18px;border-radius:50%;border:1px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:8px;flex-shrink:0;}
.step-item.active .step-num{background:#C8952C;border-color:#C8952C;color:#000;}
.step-item.done .step-num{background:#1C1C1C;}
.main{max-width:820px;margin:0 auto;padding:40px 32px;}
.upload-zone{border:1px dashed #222;border-radius:4px;padding:52px 40px;text-align:center;cursor:pointer;transition:all .25s;}
.upload-zone:hover,.upload-zone.drag-over{border-color:#C8952C;background:rgba(200,149,44,.04);}
.uicon{font-size:28px;margin-bottom:14px;display:block;}
.utitle{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#F0EDE6;margin-bottom:8px;}
.usub{font-size:12px;color:#4A4A4A;margin-bottom:22px;line-height:1.7;}
.usub strong{color:#7a7a7a;}
.or-row{text-align:center;margin:14px 0;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.15em;color:#1C1C1C;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;border:none;cursor:pointer;transition:all .2s;border-radius:2px;white-space:nowrap;}
.btn-gold{background:#C8952C;color:#000;font-weight:700;}
.btn-gold:hover{background:#9A6E1A;}
.btn-gold:disabled{opacity:.35;cursor:not-allowed;}
.btn-out{background:transparent;color:#F0EDE6;border:1px solid #1C1C1C;}
.btn-out:hover{border-color:#4A4A4A;background:#111;}
.btn-ghost{background:transparent;color:#4A4A4A;border:1px solid #1C1C1C;font-size:8px;}
.btn-ghost:hover{color:#F0EDE6;border-color:#4A4A4A;}
.spinner-wrap{text-align:center;padding:60px 40px;}
.spinner{width:28px;height:28px;border:1px solid #222;border-top-color:#C8952C;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin-lbl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#4A4A4A;}
.restart-row{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
.fbadge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;background:#0E0E0E;border:1px solid #1C1C1C;border-radius:2px;font-family:'Space Mono',monospace;font-size:9px;color:#4A4A4A;}
.fdot{width:5px;height:5px;border-radius:50%;background:#C8952C;flex-shrink:0;}
.sec{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:#C8952C;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #1C1C1C;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sec span{color:#222;font-size:7px;letter-spacing:.1em;}
.sec .opt{color:#333;}
.fg{display:grid;gap:12px;margin-bottom:28px;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fr3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;}
.fd{display:flex;flex-direction:column;gap:5px;}
.fd label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#4A4A4A;display:flex;align-items:center;gap:6px;}
.atag{color:#2a6a2a;font-size:7px;}
.wtag{color:#C8952C;font-size:7px;}
.fd input,.fd select,.fd textarea{background:#0C0C0C;border:1px solid #1C1C1C;border-radius:2px;padding:9px 11px;color:#F0EDE6;font-family:'Inter',sans-serif;font-size:16px;transition:all .15s;outline:none;width:100%;}.fd textarea{min-height:86px;resize:vertical;line-height:1.5}@media(min-width:601px){.fd input,.fd select,.fd textarea{font-size:13px;}}.fd input:focus,.fd select:focus,.fd textarea:focus{border-color:#C8952C;}
.fd input.af{border-color:#1a3a1a;background:#070E07;color:#6DB87A;}
.fd input.bad,.fd select.bad,.fd textarea.bad{border-color:#8C3A2E;}
.fd input::placeholder{color:#1C1C1C;}
.ferr{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.06em;color:#B05242;}
.divider{height:1px;background:#111;margin:24px 0;}
.actions{display:flex;justify-content:flex-end;gap:10px;padding-top:16px;border-top:1px solid #111;flex-wrap:wrap;}
.errbox{background:rgba(200,149,44,.06);border:1px solid rgba(200,149,44,.2);border-radius:3px;padding:12px 16px;font-size:12px;color:#D4A555;margin-bottom:18px;line-height:1.6;}
.infobox{background:#0C0C0C;border:1px solid #1C1C1C;border-radius:3px;padding:12px 16px;font-size:12px;color:#7a7a7a;margin-bottom:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;line-height:1.6;}
.missing{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.06em;color:#4A4A4A;text-align:right;line-height:1.9;flex:1;min-width:200px;}
.missing b{color:#B05242;font-weight:400;}
.equip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
.ecard{border:1px solid #1C1C1C;border-radius:3px;padding:14px;cursor:pointer;transition:all .2s;}
.ecard:hover{border-color:#4A4A4A;}
.ecard.sel{border-color:#C8952C;background:rgba(200,149,44,.06);}
.eicon{font-size:20px;margin-bottom:8px;}
.ename{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#F0EDE6;margin-bottom:3px;}
.edesc{font-size:10px;color:#4A4A4A;}
.sum-card{background:#0E0E0E;border:1px solid #1C1C1C;border-radius:4px;margin-bottom:20px;overflow:hidden;}
.sum-hdr{padding:12px 18px;border-bottom:1px solid #111;display:flex;align-items:center;justify-content:space-between;background:#0A0A0A;gap:10px;flex-wrap:wrap;}
.sum-lbl{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.25em;text-transform:uppercase;color:#C8952C;}
.sum-body{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;}
.sf{display:flex;flex-direction:column;gap:3px;}
.sk{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:#222;}
.sv{font-size:12px;color:#888;word-break:break-word;}
.sv.hi{color:#F0EDE6;font-weight:500;}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.acard{background:#0E0E0E;border:1px solid #1C1C1C;border-radius:4px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
.acard:hover{border-color:#2a2a2a;}
.aicon{font-size:22px;}
.atitle{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#F0EDE6;}
.adesc{font-size:11px;color:#4A4A4A;line-height:1.5;}
.abtns{display:flex;gap:8px;flex-wrap:wrap;}
.em-card{background:#0E0E0E;border:1px solid #1C1C1C;border-radius:4px;overflow:hidden;}
.em-hdr{padding:12px 18px;border-bottom:1px solid #111;display:flex;align-items:center;justify-content:space-between;background:#0A0A0A;}
.em-lbl{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.25em;text-transform:uppercase;color:#C8952C;}
.em-body{padding:22px 24px;}
.em-text{font-size:12.5px;line-height:1.75;color:#888;white-space:pre-wrap;font-family:'Inter',sans-serif;}
.hist-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border:1px solid #1C1C1C;border-radius:3px;margin-bottom:8px;background:#0C0C0C;flex-wrap:wrap;}
.hist-main{min-width:0;}
.hist-name{font-size:13px;color:#F0EDE6;margin-bottom:3px;word-break:break-word;}
.hist-meta{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.08em;color:#4A4A4A;text-transform:uppercase;}
.empty{text-align:center;padding:50px 20px;color:#333;font-size:12px;}
.toast{position:fixed;bottom:20px;right:20px;background:#0F0F0F;border:1px solid #C8952C;padding:10px 16px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;color:#F0EDE6;border-radius:2px;animation:slideIn .25s ease;z-index:999;max-width:calc(100vw - 40px);}
@keyframes slideIn{from{transform:translateY(14px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#0E0E0E;border:1px solid #1C1C1C;border-radius:4px;padding:32px;width:480px;max-width:100%;max-height:88vh;overflow-y:auto;}
.modal-title{font-family:'Playfair Display',serif;font-size:18px;color:#F0EDE6;margin-bottom:8px;}
.modal-desc{font-size:12px;color:#4A4A4A;line-height:1.6;margin-bottom:20px;}
.modal-desc a{color:#C8952C;text-decoration:none;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap;}
.dstat{display:flex;align-items:center;gap:8px;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:10px 12px;border:1px solid #1C1C1C;border-radius:2px;margin-bottom:18px;}
.dstat.ok{color:#6DB87A;border-color:#1B4D2E;background:rgba(27,77,46,.08);}
.dstat.no{color:#8a7a4a;border-color:#2a2415;background:rgba(200,149,44,.05);}
.process-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:22px}.process-step{border:1px solid #1C1C1C;background:#0B0B0B;border-radius:3px;padding:10px 8px;min-height:58px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}.process-step.done{border-color:#24462D;background:#0A120C}.process-step.current{border-color:#C8952C;background:rgba(200,149,44,.07)}.process-step small{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.08em;text-transform:uppercase;color:#4A4A4A;line-height:1.4}.process-step.current small{color:#D4A555}.process-step.done small{color:#6DB87A}.process-num{font-family:'Space Mono',monospace;font-size:8px;color:#2A2A2A}.process-step.current .process-num{color:#C8952C}.process-step.done .process-num{color:#3A7049}.request-hero{border:1px solid #2A2415;background:linear-gradient(135deg,rgba(200,149,44,.08),rgba(200,149,44,.02));border-radius:4px;padding:18px 20px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.request-id{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.12em;color:#F0EDE6}.request-help{font-size:11px;color:#6A6A6A;margin-top:5px;line-height:1.5}.status-pill{display:inline-flex;align-items:center;border:1px solid #4A3A12;border-radius:999px;padding:6px 10px;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:#D4A555;background:#100E08}.status-pill.green{color:#6DB87A;border-color:#24462D;background:#09110B}.note-card{background:#0C0C0C;border-left:3px solid #C8952C;padding:13px 15px;margin-bottom:20px;font-size:11px;color:#777;line-height:1.65}.checkrow{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;border:1px solid #1C1C1C;border-radius:3px;background:#0C0C0C;cursor:pointer}.checkrow input{width:18px;height:18px;accent-color:#C8952C;flex-shrink:0}.checkrow strong{display:block;font-size:12px;color:#DAD7D0;margin-bottom:3px}.checkrow span{font-size:10px;color:#555;line-height:1.45}.pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}.metric{border:1px solid #1C1C1C;background:#0C0C0C;border-radius:4px;padding:14px}.metric b{display:block;font-family:'Playfair Display',serif;font-size:23px;color:#F0EDE6;margin-bottom:3px}.metric span{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:#4A4A4A}.hist-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px}.next-action{font-size:10px;color:#777;line-height:1.5}.installation-card{border:1px solid #24462D;background:#09100B;border-radius:4px;padding:18px 20px;margin-top:20px}.installation-card .sec{border-color:#193421}
@media(max-width:600px){
  .main{padding:24px 16px;}
  .fr,.fr3,.act-row,.equip-grid{grid-template-columns:1fr;}
  .sum-body{grid-template-columns:1fr;}
  .header{padding:0 16px;}
  .header-sub{display:none;}
  .header-sep{display:none;}
  .steps{padding:0 6px;}
  .modal{padding:24px 20px;}
  .toast{left:20px;right:20px;text-align:center;}
  .process-strip{grid-template-columns:repeat(3,1fr)}.pipeline{grid-template-columns:1fr 1fr}
}

/* ---------- identidade visual do portal On-Trade ---------- */
:root{--ink:#07110c;--green-950:#081b12;--green-900:#0b281a;--green-800:#12452e;--green-500:#3a8d5e;--cream:#f3f0e7;--paper:#fbfaf6;--white:#fff;--orange:#f36c21;--orange-soft:#fff0e6;--line:#dcded8;--muted:#6c756f;--success:#278357;--warn:#bc7a16;--shadow:0 12px 40px rgba(8,27,18,.08);--display:'Barlow Condensed',Impact,sans-serif;}
body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif}.app{background:var(--cream)}
::-webkit-scrollbar-track{background:var(--cream)}::-webkit-scrollbar-thumb{background:#b9c3bc}
.header{min-height:82px;padding:0 36px;background:var(--green-950);border:0;color:var(--white);box-shadow:0 6px 24px rgba(8,27,18,.16)}
.header-left{padding:18px 0}.logo{font-family:var(--display);font-style:normal;font-weight:800;font-size:25px;letter-spacing:.02em;text-transform:uppercase;color:var(--white)}
.header-sep{height:28px;background:rgba(255,255,255,.18)}.header-sub{color:#b8c5bd;font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:.15em}
.hbtn{color:#c7d1cb;border-color:rgba(255,255,255,.22);border-radius:8px;padding:9px 12px}.hbtn:hover,.hbtn.warn{color:var(--orange);border-color:var(--orange)}.hbtn.ok{color:#87d2a7;border-color:#3a7150}
.steps{padding:0 32px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 3px 12px rgba(8,27,18,.03)}
.step-item{padding:15px 17px;color:#9aa49e}.step-item.active{color:var(--green-950);border-bottom-color:var(--orange)}.step-item.done{color:var(--green-500);border-bottom-color:transparent}.step-item.active .step-num{background:var(--orange);border-color:var(--orange);color:#fff}.step-item.done .step-num{background:#e8eee9;border-color:#b8c8bd}
.main{max-width:980px;padding:34px 32px 64px}
.upload-zone{background:var(--paper);border:2px dashed #aeb8b1;border-radius:14px;padding:54px 38px;box-shadow:0 4px 14px rgba(8,27,18,.03)}.upload-zone:hover,.upload-zone.drag-over{border-color:var(--orange);background:var(--orange-soft)}
.uicon{width:52px;height:52px;display:grid;place-items:center;margin:0 auto 15px;border-radius:13px;background:var(--green-900);color:#fff;font-size:25px}.utitle,.modal-title{font-family:var(--display);font-style:normal;text-transform:uppercase;font-weight:800;color:var(--ink)}.utitle{font-size:29px}.usub{color:var(--muted);font-size:13px}.usub strong{color:var(--green-800)}.or-row{color:#9aa49e}
.btn{border-radius:8px;font-family:'Inter',sans-serif;font-size:10px;font-weight:800;letter-spacing:.09em}.btn-gold{background:var(--orange);color:#fff}.btn-gold:hover{background:#d85818}.btn-out{color:var(--green-800);border-color:var(--green-800)}.btn-out:hover{background:#e8eee9;border-color:var(--green-500)}.btn-ghost{color:var(--muted);border-color:var(--line)}.btn-ghost:hover{color:var(--green-800);border-color:var(--green-500);background:#e8eee9}
.spinner{border-color:#cfd6d1;border-top-color:var(--orange)}.spin-lbl{color:var(--muted)}
.fbadge,.sum-card,.acard,.em-card,.hist-row,.metric,.checkrow{background:var(--paper);border-color:var(--line);border-radius:10px}.fbadge{color:var(--muted)}.fdot{background:var(--orange)}
.sec{font-family:'Inter',sans-serif;font-size:10px;font-weight:800;color:var(--green-800);border-color:var(--line)}.sec span,.sec .opt{color:var(--muted)}
.fd label{font-family:'Inter',sans-serif;font-size:9px;font-weight:800;color:var(--muted)}.fd input,.fd select,.fd textarea{background:var(--paper);border-color:var(--line);border-radius:8px;color:var(--ink)}.fd input:focus,.fd select:focus,.fd textarea:focus{border-color:var(--green-500);box-shadow:0 0 0 3px rgba(58,141,94,.10)}.fd input.af{border-color:#7bb092;background:#f2faf5;color:var(--green-800)}.fd input::placeholder{color:#a8afaa}.atag{color:var(--success)}.wtag{color:var(--orange)}
.divider,.actions{border-color:var(--line)}.divider{background:var(--line)}

<script type="text/babel">
const {useState,useRef,useEffect} = React;

/* ---------- constantes ---------- */
const MONTHS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const EQUIP=[{id:"tap",label:"Tap Machine",icon:"🍺",desc:"Equipamento On-Trade"}];
const BA_OPTIONS=["Jerry Whilem","Julia Gutvilen","João Pedro Marques","Maria Clarentino","Mani Filardi","Marcelo Martins","Richard Cordeiro","Gustavo Viana"];
const PILLARS=["Hotzone","Key Account / Castelo","Orla / Turismo","Cena / Tendência","Outro"],PRIORITIES=["Alta","Média","Baixa"];
const MODELS={tap:["Tap 1 garrafa","Tap 3 garrafas · 4th Gen","Tap Retrô","Outro modelo"]};
const STATUS_FLOW=["Rascunho","Solicitado","Em aprovação","Aprovado","Máquina reservada","Contrato enviado","Assinado","Instalação agendada","Instalado","Ativo"],STATUS_SHORT=["Solicitação","Aprovação","Reserva","Contrato","Instalação","Ativo"];

const PROXY="./.netlify/functions/cnpj";

const K_DRAFT="jgr_draft_v3",K_HIST="jgr_processos_v3",K_KEY="jgr_api_key",K_BA="jgr_ba_nome",K_DEST="jgr_dest_email",K_TEAM_PIN="jgr_team_pin",K_MANAGER_PIN="jgr_manager_pin";

const BLANK=()=>({razaoSocial:"",cnpj:"",ie:"",endereco:"",complemento:"",cidade:"",estado:"",cep:"",data:TODAY(),
  requestId:makeId(),status:"Rascunho",nomeFantasia:"",prioridade:"Média",pilar:"Hotzone",justificativa:"",volumeEstimado:"",poAtual:"",localInstalacao:"",equipTipo:"tap",equipModelo:"Tap 1 garrafa",equipSerie:"",equipPatrimonio:"",equipVolt:"220",
  nomeRep:"",cpfRep:"",emailRep:"",
  nomeRep2:"",cpfRep2:"",emailRep2:"",
  nomeTes:"",cpfTes:"",emailTes:"",
  nomeBa:localStorage.getItem(K_BA)||"",dataInstalacao:"",fotoInstalacao:"",bamAtualizado:false,observacao:""});

/* ---------- máscaras e validação ---------- */
const onlyD=v=>String(v||"").replace(/\D/g,"");
const mask=(v,t)=>{const d=onlyD(v);
  if(t==="cnpj")return d.slice(0,14).replace(/(\d{2})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1/$2").replace(/(\d{4})(\d)/,"$1-$2");

const validCPF=v=>{const c=onlyD(v);if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;

const validCNPJ=v=>{const c=onlyD(v);if(c.length!==14||/^(\d)\1{13}$/.test(c))return false;
  const calc=len=>{let p=len-7,s=0;for(let i=len;i>=1;i--){s+=+c[len-i]*p--;if(p<2)p=9;}const r=s%11;return r<2?0:11-r;};
  return calc(12)===+c[12]&&calc(13)===+c[13];};
const validEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||"").trim());
const fmtDate=iso=>{if(!iso)return"___";const[y,m,d]=iso.split("-");return`${parseInt(d)}   de   ${MONTHS[parseInt(m)-1]}   de   ${y}`;};

/* ---------- importação de BAM, B.A Management e CSV ---------- */
const norm=v=>String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const IMPORT_ALIASES={
  nomeFantasia:["venue","name","nome fantasia","cliente","customer","account","outlet","estabelecimento","casa"],
  razaoSocial:["razao social","legal name","nome empresarial","company name"],
  cnpj:["cnpj","tax id"],ie:["ie","inscricao estadual","state registration"],
  endereco:["address","endereco","logradouro","street"],bairro:["neighborhood","bairro"],complemento:["complemento","complement","address 2"],
  cidade:["cidade","city","municipio"],estado:["estado","state","uf"],cep:["cep","postal code","zip code"],
  nomeBa:["b a","ba","brand ambassador","owner","responsavel"],prioridade:["priority","prioridade"],
  classificacao:["classification","classificacao"],statusBase:["status","account status","status da conta"],
  poAtual:["efficiency","perfect outlet score","po atual"],dataRegistro:["registration date","data de registro","visit date","data da visita"],
  singleTap:["single bottle tap machine","single tap machine","tap 1 garrafa"],dualTap:["dual tap machine","tap dupla"],tripleTap:["3 bottle tap machine","triple tap machine","tap 3 garrafas"],
  equipTipo:["equipment type","tipo de equipamento","equipamento"],equipModelo:["equipment model","modelo do equipamento","modelo"],
  equipSerie:["serial number","numero de serie","n de serie","serie"],equipPatrimonio:["patrimonio","asset number","numero de patrimonio"],equipVolt:["voltagem","voltage"],
  localInstalacao:["local de instalacao","installation location"],volumeEstimado:["volume estimado","estimated volume"],pilar:["pilar","territorio","territory"]

const importVal=(row,aliases)=>{const entries=Object.entries(row||{}).map(([k,v])=>[norm(k),v]);for(const alias of aliases){const exact=entries.find(([k])=>k===alias);if(exact&&String(exact[1]??"").trim()!=="")return exact[1];}for(const alias of aliases.filter(x=>x.length>=7)){const close=entries.find(([k])=>k.endsWith(" "+alias)||k.startsWith(alias+" "));if(close&&String(close[1]??"").trim()!=="")return close[1];}return"";};
const matchBA=v=>{const n=norm(v);if(!n)return"";return BA_OPTIONS.find(x=>norm(x)===n)||BA_OPTIONS.find(x=>norm(x).split(" ")[0]===n.split(" ")[0])||"";};

const mapImportRow=row=>{
  const get=k=>importVal(row,IMPORT_ALIASES[k]);
  const single=countValue(get("singleTap")),dual=countValue(get("dualTap")),triple=countValue(get("tripleTap"));
  const rawEquip=norm(get("equipTipo"));let equipTipo="",equipModelo="";
  if(triple>0){equipTipo="tap";equipModelo="Tap 3 garrafas · 4th Gen";}else if(dual>0){equipTipo="tap";equipModelo="Outro modelo";}else if(single>0){equipTipo="tap";equipModelo="Tap 1 garrafa";}else if(rawEquip.includes("tap")||rawEquip.includes("torneira")){equipTipo="tap";}
  const endereco=String(get("endereco")||"").trim(),bairro=String(get("bairro")||"").trim();
  return{nomeFantasia:String(get("nomeFantasia")||"").trim(),razaoSocial:String(get("razaoSocial")||"").trim(),cnpj:String(get("cnpj")||"").trim(),ie:String(get("ie")||"").trim(),
    endereco:[endereco,bairro&&!norm(endereco).includes(norm(bairro))?bairro:""].filter(Boolean).join(", "),complemento:String(get("complemento")||"").trim(),cidade:String(get("cidade")||"").trim(),estado:String(get("estado")||"").trim(),cep:String(get("cep")||"").trim(),
    nomeBa:matchBA(get("nomeBa")),nomeBaOriginal:String(get("nomeBa")||"").trim(),prioridade:translatePriority(get("prioridade")),classificacao:String(get("classificacao")||"").trim(),statusBase:String(get("statusBase")||"").trim(),poAtual:String(get("poAtual")||"").trim(),dataRegistro:get("dataRegistro"),
    equipTipo,equipModelo:equipModelo||String(get("equipModelo")||"").trim(),equipSerie:String(get("equipSerie")||"").trim(),equipPatrimonio:String(get("equipPatrimonio")||"").trim(),equipVolt:String(get("equipVolt")||"").replace(/\D/g,"").slice(0,3),localInstalacao:String(get("localInstalacao")||"").trim(),volumeEstimado:String(get("volumeEstimado")||"").trim(),pilar:PILLARS.find(x=>norm(x)===norm(get("pilar")))||""};
};
const workbookRows=workbook=>{
  const aliases=Object.values(IMPORT_ALIASES).flat(),found=[];
  (workbook.SheetNames||[]).forEach(sheetName=>{
    const sheet=workbook.Sheets[sheetName],matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:"",raw:false});
    let headerAt=-1,best=0;
    matrix.slice(0,20).forEach((row,i)=>{const score=row.reduce((sum,v)=>sum+(aliases.includes(norm(v))?1:0),0);if(score>best){best=score;headerAt=i;}});
    if(headerAt<0||best<1)return;
    const headers=matrix[headerAt].map((v,i)=>String(v||`Coluna ${i+1}`).trim());
    matrix.slice(headerAt+1).forEach((values,rowIndex)=>{const raw={};headers.forEach((h,i)=>{raw[h]=values[i]??"";});const mapped=mapImportRow(raw),status=norm(mapped.statusBase),classification=norm(mapped.classificacao);if(["disabled","inactive","inativo","desativado"].includes(status)||classification&&classification!=="on trade")return;if(mapped.nomeFantasia||onlyD(mapped.cnpj).length===14)found.push({...mapped,_sheet:sheetName,_row:rowIndex+headerAt+2});});
  });
  const unique=new Map();found.forEach(item=>{const key=onlyD(item.cnpj)||`${norm(item.nomeFantasia)}|${norm(item.nomeBaOriginal||item.nomeBa)}`;if(!key)return;const current=unique.get(key),a=Date.parse(item.dataRegistro)||0,b=Date.parse(current?.dataRegistro)||0;if(!current||a>=b)unique.set(key,item);});
  return[...unique.values()].sort((a,b)=>a.nomeFantasia.localeCompare(b.nomeFantasia,"pt-BR"));
};

/* ---------- leitura local de documentos ---------- */
const CNPJ_LABELS=["NÚMERO DE INSCRIÇÃO","NOME EMPRESARIAL","TÍTULO DO ESTABELECIMENTO (NOME DE FANTASIA)","LOGRADOURO","NÚMERO","COMPLEMENTO","CEP","BAIRRO/DISTRITO","MUNICÍPIO","UF","ENDEREÇO ELETRÔNICO","TELEFONE","SITUAÇÃO CADASTRAL","DATA DA SITUAÇÃO CADASTRAL","DATA DE ABERTURA","PORTE"];
const labelEnd=(tokens,label)=>{const target=norm(label),clean=tokens.map(norm);for(let i=0;i<clean.length;i++){for(let size=1;size<=4&&i+size<=clean.length;size++){if(norm(clean.slice(i,i+size).join(" "))===target)return i+size;}}return-1;};
const valueAfterLabel=(tokens,label)=>{const start=labelEnd(tokens,label);if(start<0)return"";const known=new Set(CNPJ_LABELS.map(norm));for(let i=start;i<Math.min(tokens.length,start+6);i++){const value=String(tokens[i]||"").trim(),n=norm(value);if(!value||known.has(n)||n==="matriz")continue;if(/^\*+$/.test(value))return"";return value;}return"";};
const parseCnpjTokens=tokens=>{
  const all=tokens.join("\n"),cnpj=(all.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/)||all.match(/\b\d{14}\b/)||[])[0]||"";
  const logradouro=valueAfterLabel(tokens,"LOGRADOURO"),numero=valueAfterLabel(tokens,"NÚMERO"),bairro=valueAfterLabel(tokens,"BAIRRO/DISTRITO"),complemento=valueAfterLabel(tokens,"COMPLEMENTO");
  return{razaoSocial:valueAfterLabel(tokens,"NOME EMPRESARIAL"),nomeFantasia:valueAfterLabel(tokens,"TÍTULO DO ESTABELECIMENTO (NOME DE FANTASIA)"),cnpj,
    logradouro:[logradouro,numero].filter(Boolean).join(", "),bairro,complemento,cidade:valueAfterLabel(tokens,"MUNICÍPIO"),estado:valueAfterLabel(tokens,"UF"),cep:valueAfterLabel(tokens,"CEP"),situacaoCadastral:valueAfterLabel(tokens,"SITUAÇÃO CADASTRAL")};
};
const looksLikePersonName=value=>{
  const raw=String(value||"").replace(/\s+/g," ").trim(),n=norm(raw),words=n.split(" ").filter(Boolean);
  if(raw.length<6||raw.length>90||words.length<2||words.length>8||/\d|@|www|http/.test(raw))return false;
  if(/nome|cpf|rg|registro|identidade|filiacao|nascimento|nacionalidade|naturalidade|assinatura|documento|habilitacao|republica|federativa|brasil|detran|secretaria|logradouro|endereco|socio|administrador|contrato|social|empresarial|limitada|ltda|titular/.test(n))return false;
  return /^[A-Za-zÀ-ÿ' -]+$/.test(raw);
};
const personalNameAfterLabel=tokens=>{
  const labels=["NOME CIVIL","NOME COMPLETO","NOME E SOBRENOME","NOME DO TITULAR","NOME"];
  for(const label of labels){const start=labelEnd(tokens,label);if(start<0)continue;for(let i=start;i<Math.min(tokens.length,start+5);i++){if(looksLikePersonName(tokens[i]))return String(tokens[i]).replace(/\s+/g," ").trim();}}
  return"";
};
const nameNearCpf=(tokens,cpf)=>{
  const idx=tokens.findIndex(x=>onlyD(x).includes(onlyD(cpf)));if(idx<0)return"";
  for(let distance=1;distance<=8;distance++)for(const pos of [idx-distance,idx+distance]){if(pos>=0&&pos<tokens.length&&looksLikePersonName(tokens[pos]))return String(tokens[pos]).replace(/\s+/g," ").trim();}
  return"";
};
const parseRepresentatives=tokens=>{
  const all=tokens.join("\n"),flat=tokens.join(" "),matches=all.match(/\b\d{3}[.\s]?\d{3}[.\s]?\d{3}[-\s]?\d{2}\b/g)||[],cpfs=[...new Set(matches.map(x=>mask(x,"cpf")).filter(validCPF))],labelName=personalNameAfterLabel(tokens),contractNames=[];
  const repPattern=/(?:s[oó]ci[oa]|administrador[a]?|representante legal)\s*[:,;\-]?\s*([A-ZÀ-Ý][A-Za-zÀ-ÿ' ]{5,80}?)(?=,\s*(?:brasileir|portador|inscrit|cpf|rg))/gi;let match;
  while((match=repPattern.exec(flat))&&contractNames.length<2){const name=String(match[1]||"").replace(/\s+/g," ").trim();if(looksLikePersonName(name))contractNames.push(name);}
  return cpfs.slice(0,2).map((cpf,i)=>({cpf,nome:(i===0&&labelName)||nameNearCpf(tokens,cpf)||contractNames[i]||""})).filter(x=>x.cpf||x.nome);
};
const parseDocumentTokens=tokens=>{
  const company=parseCnpjTokens(tokens),representatives=parseRepresentatives(tokens),hasCompany=Boolean(company.cnpj||company.razaoSocial||company.nomeFantasia);
  if(!hasCompany&&!representatives.length)throw new Error("não encontrei CNPJ, CPF ou representante em texto legível");
  const kind=hasCompany&&representatives.length?"Contrato social":hasCompany?"Cartão CNPJ":representatives.length>1?"Documentos dos representantes":"Documento do representante";
  return{...company,representatives,_documentKind:kind};
};
const withTimeout=(promise,ms,message)=>{
  let timer;const timeout=new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(message)),ms);});
  return Promise.race([promise,timeout]).finally(()=>clearTimeout(timer));
};
const readPdfLocally=async buffer=>{

  const applyParsed=(parsed,sourceLabel="arquivo",totalRows=1,documentCount=1)=>{

  const parsePdfFile=async file=>{

    try{return await readPdfLocally(buffer);}

      if(!/cnpj/i.test(file.name)||(!proxy&&!apiKey))throw localError;
      const b64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>resolve(e.target.result.split(",")[1]);reader.onerror=()=>reject(new Error("falha ao abrir o arquivo"));reader.readAsDataURL(file);});

  const handleFiles=async fileList=>{
    const files=[...fileList].filter(Boolean);

    if(invalid){setErr(`Formato não reconhecido em ${invalid.name}. Envie PDF, XLSX, XLS ou CSV.`);return;}
    const job=++pdfJob.current,parsedDocs=[],choices=[],report=[];

      for(const file of files){

      {!showHist&&(
        <div className="steps">
          {[["01","Importar cliente"],["02","Solicitação"],["03","Fluxo"]].map(([n,l],i)=>(
            <div key={i} className={`step-item${step===i+1?" active":step>i+1?" done":""}`}
              onClick={()=>{if(step>i+1)setStep(i+1);}}>
              <div className="step-num">{step>i+1?"✓":n}</div>{l}
            </div>
          ))}
        </div>
      )}

      <div className="main">
        {showHist&&(
          hist.length===0
            ? <div className="empty">Nenhum processo registrado neste aparelho ainda.</div>
            : <>
                <div className="sec">Acompanhamento de comodatos <span>{shared&&teamPin?"base do time + dados locais":"salvo neste aparelho"}</span></div>
                <div className="pipeline"><div className="metric"><b>{hist.length}</b><span>Total</span></div><div className="metric"><b>{hist.filter(h=>["Solicitado","Em aprovação"].includes(h.status)).length}</b><span>Em aprovação</span></div><div className="metric"><b>{hist.filter(h=>["Aprovado","Máquina reservada","Contrato enviado","Assinado","Instalação agendada"].includes(h.status)).length}</b><span>Em andamento</span></div><div className="metric"><b>{hist.filter(h=>h.status==="Ativo").length}</b><span>Ativos</span></div></div>
                {hist.map(h=>(
                  <div className="hist-row" key={h.requestId||h.ts}>
                    <div className="hist-main">
                      <div className="hist-name">{h.nomeFantasia||h.razaoSocial}</div><div className="hist-meta">{h.requestId||"Legado"} · {h.nomeBa||"BA não informado"} · {h.equip} {h.serie?`· ${h.serie}`:""}</div><div className="hist-status"><span className={`status-pill ${h.status==="Ativo"?"green":""}`}>{h.status||"Contrato enviado"}</span><span className="next-action">Próxima ação: {nextAction(h.status||"Contrato enviado")}</span></div>
                    </div>
                    {h.snap?<button className="btn btn-out" onClick={()=>{setF({...BLANK(),...h.snap,requestId:h.requestId||h.snap?.requestId||makeId(),status:h.status||h.snap?.status||"Contrato enviado"});setAuto({});setTouched({});setShowHist(false);setStep(3);toast_("Processo aberto");}}>Abrir</button>:<span className="hist-meta">Abra no aparelho que criou para ver dados pessoais</span>}
                  </div>
                ))}
              </>
        )}

        {!showHist&&step===1&&!loading&&(<>
          {err&&<div className="errbox">{err}</div>}
          {draftFound&&(
            <div className="infobox">
              <span>Rascunho não finalizado: <strong style={{color:"#F0EDE6"}}>{draftFound.razaoSocial}</strong></span>
              <span style={{marginLeft:"auto",display:"flex",gap:8}}>
                <button className="btn btn-ghost" onClick={()=>{localStorage.removeItem(K_DRAFT);setDraft(null);}}>Descartar</button>
                <button className="btn btn-out" onClick={()=>{setF({...BLANK(),...draftFound});setDraft(null);setStep(2);}}>Continuar</button>
              </span>
            </div>
          )}
          <div className="cnpj-lookup">
            <div className="cnpj-lookup-head">
              <span className="cnpj-lookup-icon">CNPJ</span>
              <div><div className="cnpj-lookup-title">Consultar pelo número</div><div className="cnpj-lookup-copy">Cole o CNPJ da casa. O app busca os dados públicos sem precisar enviar o PDF.</div></div>
            </div>
            <div className="cnpj-lookup-row">
              <input value={cnpjLookup} inputMode="numeric" autoComplete="off" aria-label="CNPJ para consulta" placeholder="00.000.000/0000-00" onChange={e=>setCnpjLookup(mask(e.target.value,"cnpj"))} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();handleCnpjLookup();}}}/>
              <button className="btn btn-gold" disabled={lookupLoading} onClick={handleCnpjLookup}>{lookupLoading?"Buscando…":"Buscar dados"}</button>
            </div>
            {lookupLoading&&<div className="cnpj-lookup-status">Consultando o cadastro público…</div>}
          </div>
          <div className="or-row">— ou envie os documentos —</div>
          <div className="document-types">
            <div className="document-type"><b>Cartão CNPJ</b><span>Dados jurídicos e endereço da casa</span></div>
            <div className="document-type"><b>Contrato social</b><span>Razão social e representantes legais</span></div>
            <div className="document-type"><b>RG, CNH ou CPF</b><span>Nome e CPF dos representantes</span></div>
            <div className="document-type"><b>BAM / planilha</b><span>Casa, BA e dados operacionais</span></div>
          </div>
          <div className="upload-zone"
            onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add("drag-over");}}
            onDragLeave={e=>e.currentTarget.classList.remove("drag-over")}
            onDrop={e=>{e.preventDefault();e.currentTarget.classList.remove("drag-over");handleFiles(e.dataTransfer.files);}}
            onClick={()=>fref.current?.click()}>
            <span className="uicon">＋</span>
            <div className="utitle">Importar dados da casa e proprietários</div>
            <div className="usub">Selecione até 8 PDFs ou planilhas de uma vez.<br/><strong>O app combina os dados encontrados; o BA apenas confere e completa o que faltar.</strong></div>
            <button className="btn btn-gold" onClick={e=>{e.stopPropagation();fref.current?.click();}}>Selecionar documentos</button>
            <input ref={fref} type="file" multiple accept=".pdf,.xlsx,.xls,.csv,application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" style={{display:"none"}} onChange={e=>{handleFiles(e.target.files);e.target.value="";}}/>
            <div className="privacy-note"><strong>Privacidade:</strong> RG, CNH, CPF e contrato social são lidos neste aparelho e não ficam armazenados. Use PDF digital com texto legível; foto ou PDF escaneado pode exigir conferência manual.</div>
          </div>
          <div className="or-row">— ou preencha sem consulta —</div>
          <div style={{textAlign:"center"}}><button className="btn btn-ghost" onClick={()=>{setStep(2);setErr("");}}>Preencher manualmente</button></div>
        </>)}

        {!showHist&&step===1&&loading&&<div className="spinner-wrap"><div className="spinner"/><div className="spin-lbl">{loadingLabel}</div><button className="btn btn-ghost" style={{marginTop:18}} onClick={()=>{pdfJob.current+=1;setLoad(false);setErr("Leitura interrompida. Tente novamente ou preencha os campos manualmente.");}}>Cancelar leitura</button></div>}

        {!showHist&&step===2&&(<>
          <div className="restart-row">
            {fn&&<div className="fbadge"><div className="fdot"/>{fn}</div>}
            <button className="btn btn-ghost" style={{marginLeft:"auto"}} onClick={reset}>Recomeçar</button>
          </div>
          {err&&<div className="errbox">{err}</div>}
          {importInfo&&<div className="import-success"><span>✓</span><span><b>{importInfo.fields} campos preenchidos automaticamente</b>{importInfo.documentCount>1?`${importInfo.documentCount} documentos combinados`:<>Origem: {importInfo.source}</>}{importInfo.totalRows>1?` · ${importInfo.totalRows} casas encontradas`:""}. Revise os dados jurídicos e os representantes antes de enviar.</span></div>}
          {documentReport.length>0&&<div className="doc-report">{documentReport.map((doc,i)=><div className="doc-report-row" key={`${doc.name}-${i}`}><span><b>{doc.name}</b><br/>{doc.detail}</span><span className={`doc-report-status${doc.status==="Revisar"?" warn":""}`}>{doc.status}</span></div>)}</div>}

          <div className="request-hero"><div><div className="request-id">{f.requestId}</div><div className="request-help">Este número acompanha aprovação, contrato, instalação e BAM.</div></div><span className="status-pill">{f.status}</span></div>
          <div className="sec">Decisão comercial <span>por que este equipamento deve ir para esta casa</span></div>
          <div className="fg"><F k="nomeFantasia" label="Nome da casa" ph="Nome usado pelo time" wide/><div className="fr3"><div className="fd"><label>Prioridade</label><select value={f.prioridade} onChange={e=>upd("prioridade",e.target.value)}>{PRIORITIES.map(x=><option key={x}>{x}</option>)}</select></div><div className="fd" style={{gridColumn:"span 2"}}><label>Pilar / território</label><select value={f.pilar} onChange={e=>upd("pilar",e.target.value)}>{PILLARS.map(x=><option key={x}>{x}</option>)}</select></div></div><div className="fr3"><F k="volumeEstimado" label="Volume estimado / mês" ph="ex: 12 garrafas"/><F k="poAtual" label="Perfect Outlet atual" ph="ex: 3/6"/><F k="localInstalacao" label="Local de instalação" ph="ex: backbar"/></div><div className="fd"><label>Justificativa e objetivo</label><textarea value={f.justificativa} className={touched.justificativa&&errs.justificativa?"bad":""} onBlur={()=>blur("justificativa")} onChange={e=>upd("justificativa",e.target.value)} placeholder="Qual oportunidade será destravada? Inclua giro, visibilidade, ativação ou papel estratégico da casa."/>{touched.justificativa&&errs.justificativa&&<span className="ferr">{errs.justificativa}</span>}</div></div><div className="divider"/>

          <div className="sec">Comodatária {Object.keys(auto).length>0&&<span>● preenchido pelo arquivo</span>}</div>
          <div className="fg">
            <F k="razaoSocial" label="Razão Social" ph="Nome jurídico exato" wide/>
            <div className="fr">
              <F k="cnpj" label="CNPJ" ph="XX.XXX.XXX/XXXX-XX" mk="cnpj"/>
              <F k="ie" label="I.E." ph="Isento, se não houver"/>
            </div>
            <div className="fr">
              <F k="endereco" label="Endereço" ph="Rua, número, bairro"/>
              <F k="complemento" label="Complemento" ph="Sala, andar…"/>
            </div>
            <div className="fr3">
              <F k="cidade" label="Cidade" ph="Rio de Janeiro"/>
              <F k="estado" label="UF" ph="RJ"/>
              <F k="cep" label="CEP" ph="XXXXX-XXX" mk="cep"/>
            </div>
            <div style={{maxWidth:200}}><F k="data" label="Data" type="date"/></div>
          </div>

          <div className="divider"/>
          <div className="sec">Equipamento</div>
          <div className="equip-grid">
            {EQUIP.map(eq=>(
              <div key={eq.id} className={`ecard${f.equipTipo===eq.id?" sel":""}`} onClick={()=>setF(p=>({...p,equipTipo:eq.id,equipModelo:MODELS[eq.id][0]}))}>
                <div className="eicon">{eq.icon}</div><div className="ename">{eq.label}</div><div className="edesc">{eq.desc}</div>
              </div>))}
          </div>
          <div className="fg">
            <div className="fd"><label>Modelo solicitado</label><select value={f.equipModelo} onChange={e=>upd("equipModelo",e.target.value)}>{(MODELS[f.equipTipo]||[]).map(x=><option key={x}>{x}</option>)}</select></div>
            <div className="fr">
              <F k="equipSerie" label="Número de Série" ph="Preencher na reserva" note="obrigatório para contrato"/>
              <div className="fd" style={{maxWidth:160}}>
                <label>Voltagem</label>
                <select value={f.equipVolt} onChange={e=>upd("equipVolt",e.target.value)}>
                  <option value="110">110V</option>
                  <option value="220">220V</option>
                </select>
              </div>
            </div>
            <div style={{maxWidth:340}}><F k="equipPatrimonio" label="Nº de patrimônio" ph="Se houver"/></div>
          </div>

          <div className="divider"/>
          <div className="sec">Representante Legal <span>necessário para o contrato · não bloqueia o envio para aprovação</span></div>
          <div className="fg">
            <F k="nomeRep" label="Nome Completo" ph="Nome completo" wide/>
            <div className="fr">
              <F k="cpfRep" label="CPF" ph="XXX.XXX.XXX-XX" mk="cpf"/>
              <F k="emailRep" label="E-mail" ph="email@ativo.com" type="email" note="e-mail ativo"/>
            </div>
          </div>

          <div className="sec">2º Representante <span className="opt">opcional — só se o contrato social exigir duas assinaturas</span></div>
          <div className="fg">
            <F k="nomeRep2" label="Nome Completo" ph="Deixe vazio se não houver" wide/>
            <div className="fr">
              <F k="cpfRep2" label="CPF" ph="XXX.XXX.XXX-XX" mk="cpf"/>
              <F k="emailRep2" label="E-mail" ph="email@ativo.com" type="email"/>
            </div>
          </div>

          <div className="divider"/>
          <div className="sec">Testemunha <span>necessária para o contrato · pode ser preenchida depois da aprovação</span></div>
          <div className="fg">
            <F k="nomeTes" label="Nome Completo" ph="Nome completo" wide/>
            <div className="fr">
              <F k="cpfTes" label="CPF" ph="XXX.XXX.XXX-XX" mk="cpf"/>
              <F k="emailTes" label="E-mail" ph="email@ativo.com" type="email" note="e-mail ativo"/>
            </div>
          </div>

          <div className="divider"/>
          <div className="sec">Brand Ambassador</div>
          <div className="fg"><div className="fd" style={{maxWidth:420}}><label>Seu nome</label><select value={f.nomeBa} className={touched.nomeBa&&errs.nomeBa?"bad":""} onBlur={()=>blur("nomeBa")} onChange={e=>upd("nomeBa",e.target.value)}><option value="">Selecione seu nome</option>{BA_OPTIONS.map(x=><option key={x}>{x}</option>)}</select>{touched.nomeBa&&errs.nomeBa&&<span className="ferr">{errs.nomeBa}</span>}</div></div>

          <div className="actions">
            {!ok&&(
              <div className="missing">
                Para enviar à aprovação falta: {Object.keys(requestErrs).map(k=>LABELS[k]).filter(Boolean).map((l,i,a)=>(
                  <React.Fragment key={l}><b>{l}</b>{i<a.length-1?" · ":""}</React.Fragment>))}
              </div>
            )}
            <button className="btn btn-ghost" onClick={()=>setStep(1)}>Voltar</button>
            <button className="btn btn-gold" onClick={reviewRequest}>Revisar solicitação →</button>
          </div>
        </>)}

        {!showHist&&step===3&&(<>
          <div className="restart-row">
            <button className="btn btn-ghost" onClick={()=>setStep(2)}>← Editar</button>
            <button className="btn btn-ghost" style={{marginLeft:"auto"}} onClick={reset}>Novo comodato</button>
          </div>
          {err&&<div className="errbox">{err}</div>}
          <div className="request-hero"><div><div className="request-id">{f.requestId}</div><div className="request-help">Próxima ação: {nextAction(f.status)}</div></div><span className={`status-pill ${f.status==="Ativo"?"green":""}`}>{f.status}</span></div>
          <div className="process-strip">{STATUS_SHORT.map((label,i)=><div key={label} className={`process-step ${i<stageIndex?"done":i===stageIndex?"current":""}`}><span className="process-num">{i<stageIndex?"✓":String(i+1).padStart(2,"0")}</span><small>{label}</small></div>)}</div>
          <div className="note-card">O contrato deve ser gerado somente depois da aprovação. A série e o patrimônio entram quando a máquina for reservada; a instalação só é concluída com foto e BAM atualizado.</div>
          <div className="sum-card">
            <div className="sum-hdr">
              <span className="sum-lbl">Confirme os dados</span>
              <span style={{fontFamily:"'Space Mono',monospace",fontSize:8,color:"#4A4A4A"}}>{EQlbl} · {f.equipSerie} · {f.equipVolt}V</span>
            </div>
            <div className="sum-body">
              {[["Casa",f.nomeFantasia,true],["Solicitação",f.requestId,false],["Prioridade",f.prioridade,false],["Pilar",f.pilar,false],["Objetivo",f.justificativa,true],["Volume estimado",f.volumeEstimado||"A apurar",false],["PO atual",f.poAtual||"A apurar",false],["Razão Social",f.razaoSocial,true],["CNPJ",f.cnpj,false],["I.E.",f.ie||"—",false],
                ["Endereço",f.endereco,false],["Complemento",f.complemento||"—",false],
                ["Cidade/UF",`${f.cidade} – ${f.estado.toUpperCase()}`,false],["CEP",f.cep,false],["Data",fmtDate(f.data),false],["Modelo",f.equipModelo||"A definir",false],["Nº de série",f.equipSerie||"A reservar",false],["Patrimônio",f.equipPatrimonio||"A reservar",false],["Local de instalação",f.localInstalacao,false],
                ["Representante Legal",f.nomeRep,true],["CPF Rep.",f.cpfRep,false],["E-mail Rep.",f.emailRep,false],
                ...(f.nomeRep2.trim()?[["2º Representante",f.nomeRep2,true],["CPF Rep. 2",f.cpfRep2||"—",false],["E-mail Rep. 2",f.emailRep2||"—",false]]:[]),
                ["Testemunha",f.nomeTes,true],["CPF Tes.",f.cpfTes,false],["E-mail Tes.",f.emailTes,false],
                ["Brand Ambassador",f.nomeBa,false]].map(([k,v,hi])=>(
                <div className="sf" key={k}><span className="sk">{k}</span><span className={`sv${hi?" hi":""}`}>{v}</span></div>
              ))}
            </div>
          </div>
          <div className="actions" style={{marginBottom:22}}>{f.status==="Rascunho"&&<button className="btn btn-gold" onClick={registerRequest}>Registrar solicitação</button>}{f.status==="Solicitado"&&<button className="btn btn-gold" onClick={()=>setProcessStatus("Em aprovação")}>Enviar para aprovação</button>}{f.status==="Em aprovação"&&<><button className="btn btn-ghost" onClick={()=>setProcessStatus("Rascunho","Solicitação devolvida para ajuste")}>Devolver para ajuste</button><button className="btn btn-gold" onClick={()=>setProcessStatus("Aprovado","Solicitação aprovada")}>Gestor: aprovar</button></>}{f.status==="Aprovado"&&<button className="btn btn-gold" disabled={!f.equipSerie.trim()} onClick={()=>setProcessStatus("Máquina reservada")}>{f.equipSerie.trim()?"Confirmar máquina reservada":"Informe a série para reservar"}</button>}{f.status==="Máquina reservada"&&<button className="btn btn-gold" onClick={()=>setProcessStatus("Contrato enviado")}>Marcar contrato enviado</button>}{f.status==="Contrato enviado"&&<button className="btn btn-gold" onClick={()=>setProcessStatus("Assinado")}>Confirmar assinatura</button>}{f.status==="Assinado"&&<button className="btn btn-gold" disabled={!f.dataInstalacao} onClick={()=>setProcessStatus("Instalação agendada")}>{f.dataInstalacao?"Confirmar agendamento":"Informe a data da instalação"}</button>}{f.status==="Instalação agendada"&&<button className="btn btn-gold" disabled={!installReady} onClick={()=>setProcessStatus("Instalado")}>{installReady?"Confirmar instalação":"Foto + BAM + série obrigatórios"}</button>}{f.status==="Instalado"&&<button className="btn btn-gold" disabled={!installReady} onClick={()=>setProcessStatus("Ativo")}>Confirmar equipamento ativo</button>}</div>
          <div className="act-row">
            <div className="acard">
              <div className="aicon">📄</div>
              <div className="atitle">Contrato de Comodato</div>
              <div className="adesc">Disponível após aprovação e reserva da série. Os dados de representante e testemunha são exigidos somente na geração do contrato.</div><button className="btn btn-gold" onClick={genDocx} disabled={dlLoad||!contractUnlocked}>{dlLoad?"Gerando…":!contractUnlocked?"Aguardando aprovação / série":contractOk?"⬇ Gerar .docx":"Completar dados de assinatura"}</button>
            </div>
            <div className="acard">
              <div className="aicon">✉️</div>
              <div className="atitle">Texto do E-mail</div>
              <div className="adesc">Inclui ID, prioridade, pilar, objetivo, equipamento e BA. Anexe o .docx antes de enviar.</div>
              <div className="abtns">
                <button className="btn btn-out" onClick={copyEm}>Copiar</button>
                {dest&&<button className="btn btn-out" onClick={openMail}>Abrir no e-mail</button>}
                <button className="btn btn-ghost" onClick={()=>setShowEm(v=>!v)}>{showEm?"Ocultar":"Ver"}</button>
              </div>
            </div>
          </div>
          {showEm&&(
            <div className="em-card">
              <div className="em-hdr"><span className="em-lbl">Preview · E-mail</span><button className="btn btn-ghost" onClick={copyEm}>Copiar</button></div>
              <div className="em-body"><div className="em-text">{emailTxt()}</div></div>
            </div>
          )}
          {statusIndex>=STATUS_FLOW.indexOf("Assinado")&&(<div className="installation-card"><div className="sec">Instalação e ativação <span>evidência obrigatória</span></div><div className="fg"><div className="fr"><F k="dataInstalacao" label="Data de instalação" type="date"/><F k="fotoInstalacao" label="Link da foto instalada" ph="https://drive.google.com/..."/></div><label className="checkrow"><input type="checkbox" checked={f.bamAtualizado} onChange={e=>upd("bamAtualizado",e.target.checked)}/><span><strong>BAM atualizado</strong>Confirme somente depois de registrar o equipamento na casa correta e no BA correto.</span></label><div className="fd"><label>Observações</label><textarea value={f.observacao} onChange={e=>upd("observacao",e.target.value)} placeholder="Acesso, ponto elétrico, restrições da casa, manutenção ou próxima ação."/></div></div></div>)}
        </>)}
      </div>
      {toast&&<div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

if("serviceWorker" in navigator&&location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
